[project]
name = "fantasyprep"
version = "0.1.0"
description = "Draft decision engine tools"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "rapidfuzz>=3.6",
    "nfl_data_py>=0.3",
    "pandas>=2.0",
    "numpy>=1.26",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Modeling research only (fantasyprep.research). Deliberately optional so the
# simulator, backtest, and dataset build never depend on them.
research = ["scikit-learn>=1.4", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
